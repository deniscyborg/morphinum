# Блок nginx для магазина на том же VPS, что и usermanagementapp.com и davydovdenis.de.
# Контейнер магазина слушает только 127.0.0.1:3100, наружу его отдаёт nginx.
# Установка:
#   sudo cp nginx.conf /etc/nginx/sites-available/morphinum.ru
#   sudo ln -s /etc/nginx/sites-available/morphinum.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d morphinum.ru -d www.morphinum.ru
server {
    listen 80;
    server_name morphinum.ru www.morphinum.ru;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
